                冷能回收补偿流程, 液化循环]
  model_simulation:
    keywords: [数学模型, 动态数学模型, 动态模型, 仿真, 数值模拟, CFD, 有限元, 模型验证,
                边界条件, 控制方程, 动态特性, 数值仿真, 仿真分析, k-ε 模型]
  control_strategy:
    keywords: [控制策略, PID, MPC, 调度策略]
  optimization_algorithm:
    keywords: [遗传算法, 粒子群, NSGA, 元启发式]
  characterization_only:
    keywords: []      # 保守: v1 不主动命中, 需人工确认
  general_method:
    keywords: [综述, 综述了, 研究进展, 研究现状, 归纳总结, 现状与展望, 阐述了, 本文归纳,
                本文综述, 本文对现有的, 本文主要介绍]
